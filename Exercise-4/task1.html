<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1 - Stopwatch</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="main d-flex justify-content-center">
        <div class="time m-5 p-3 border border-black">
          <span>Time</span>
          <span id="time">00:00:00</span>
        </div>
        <div class="date m-5 p-3 border border-black">
          <span>Date</span>
          <span id="date"></span>
        </div>
      </div>
      <div class="main2 d-flex justify-content-center">
        <div class="title">
          <h4>Stopwatch <span id="stopTime">00:00:00:00</span></h4>
          
        </div>
      </div>
      <div class="main2 d-flex justify-content-center">
        <div class="btns">
          <button type="button" id="start" class="btn btn-success">Start</button>
          <button type="button" id="stop" class="btn btn-danger">Stop</button>
          <button type="button" id="resume" class="btn btn-primary">Resume</button>
          <button type="button" id="reset" class="btn btn-warning">Reset</button>
        </div>
      </div>
    </div>

    <script src="task1.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
