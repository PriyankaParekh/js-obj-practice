<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4 - Table</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <form name="form">
        <div class="table d-flex">
          <input
            type="text"
            name="firstName"
            placeholder="First Name"
            class="form-control m-3"
          />
          <input
            type="text"
            name="lastName"
            placeholder="Last Name"
            class="form-control m-3"
          />
          

          <button
            onclick="add()"
            id="mainBtn"
            type="button"
            class="btn btn-secondary m-3"
          >
            Add
          </button>

          <input type="text" id="hiddenEle" hidden />
        </div>
      </form>
      <table name="table" id="table" class="table table-borderless">
        <tr class="container d-flex justify-content-center"><td class="form-control border-0"><input type="checkbox" onclick="selectAll()" name="selectAll" id="selectAll">
        <label for="selectAll">Select All</label></td>
        <td class="form-control border-0"><label>Total <span id="totalRow"></span> selected row(s)</label></td>
        <td class="form-control border-0"><button class="btn btn-success" id="deleteBtn" onclick="deleteAll()">Delete</button></td>
    </tr>
      </table>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="task4.js"></script>
  </body>
</html>
