<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body style="background-color: aliceblue;">
    <div class="container w-25" style="margin-top: 20rem;">
      <h2 class="d-flex justify-content-center">Login</h2>
      <form name="form" action="dashboard.html">
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label "
            >Email address</label
          >
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
          />
        </div>
        <center><button type="submit" onclick="submitresult()" class="btn btn-primary">
          Submit
        </button></center>
      </form>
    </div>
    <script>
      if (getCookie("email")) {
        window.location.assign(
          "/js/additional_task/storage_task/dashboard.html"
        );
      }
      function getCookie(name) {
        let matches = document.cookie.match(
          new RegExp(
            "(?:^|; )" +
              name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, "\\$1") +
              "=([^;]*)"
          )
        );
        return matches ? decodeURIComponent(matches[1]) : undefined;
      }
      function setCookie(name, value, attributes = {}) {
        attributes = {
          path: "/",
          // add other defaults here if necessary
          ...attributes,
        };

        if (attributes.expires instanceof Date) {
          attributes.expires = attributes.expires.toUTCString();
        }

        let updatedCookie =
          encodeURIComponent(name) + "=" + encodeURIComponent(value);

        for (let attributeKey in attributes) {
          updatedCookie += "; " + attributeKey;
          let attributeValue = attributes[attributeKey];
          if (attributeValue !== true) {
            updatedCookie += "=" + attributeValue;
          }
        }

        document.cookie = updatedCookie;
      }

      // Example of use:
      function submitresult() {
        let email = form.email.value;
        setCookie("email", email, { secure: true, "max-age": 3600 });
      }
      // console.log(password);
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
