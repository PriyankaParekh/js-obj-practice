<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
</head>
<body>
    <div class="container w-50" style="margin-top: 13rem">
        <h2 class="d-flex justify-content-center">Create Course</h2>
        <form name="form" onsubmit="return false">
          <div class="mb-3">
            <input
              type="text"
              id="title"
              name="title"
              class="form-control"
              placeholder="Enter Course Title"
              id="title"
              required
            />
          </div>
  
          <div class="mb-3">
            <textarea name="desc" id="desc" cols="30" rows="6" class="form-control" placeholder="Enter Course Description" required></textarea>
          </div>
          <center>
            <button
              type="submit"
              id="submit"
              class="btn btn-primary"
            >
              Submit
            </button>
            
          </center>
        </form>
      </div>
      <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="createCourse.js" type="module"></script>
</body>
</html>
